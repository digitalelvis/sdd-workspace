name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Changelog & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Fetch all tags
        run: git fetch --tags

      - name: Check if release tag already exists
        id: tag_check
        run: |
          VERSION="v${{ steps.pkg.outputs.version }}"
          if git tag --list | grep -qx "$VERSION"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⏭️  Tag $VERSION already exists — skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "🏷️  Tag $VERSION not found — proceeding with release."
          fi

      - name: Generate changelog, tag and create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx release-it --no-increment --ci
