name: AI Project CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SDD Structure
        run: |
          if [ ! -f "AGENT.md" ]; then
            echo "AGENT.md missing!"
            exit 1
          fi
          echo "SDD structure validated."
